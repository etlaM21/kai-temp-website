    <!-- Teaser source text -->
    <script>
        const TEASER_TEXT = `Peter Handke's play Kaspar remains one of the most radical and destabilizing works of modern drama because it treats language not as a gift but as a structural violence. It begins with a figure who is a literal blank slate, a personification of raw human existence devoid of social programming, who enters the stage with a single, repetitive sentence that he does not yet understand. This character is modeled loosely on the historical Kaspar Hauser, but Handke strips away the nineteenth-century mystery to focus entirely on the mechanics of linguistic indoctrination. Throughout the duration of the play, Kaspar is subjected to a relentless barrage of voices from unseen prompters who function as the architects of his consciousness. These voices do not merely teach him to communicate; they teach him to categorize, to judge, and to conform to a pre-existing social order. Handke utilizes a technique he calls speech torture to illustrate how the acquisition of grammar is simultaneously the acquisition of a mental cage. As Kaspar learns to name the objects around him, he loses his direct, unmediated relationship with reality.`;
    </script>
